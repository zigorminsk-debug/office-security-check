# Пайплайн сборки приложения «Аудит защиты» (Office Security Check).
#
# Запускается при каждом push и pull request:
#   1. verify          — проверка форматирования, go vet, юнит-тесты (Linux).
#   2. build-windows   — сборка GUI/CLI для Windows, проверочный запуск,
#                        создание setup.exe (Inno Setup) и публикация артефактов.
#   3. release         — создание GitHub Release при push тега v*.

name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ================= 1. Проверка кода и тесты =================
  verify:
    name: Проверка кода и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false

      - name: Проверка форматирования (gofmt)
        shell: bash
        run: |
          out=$(gofmt -l main.go internal/)
          if [ -n "$out" ]; then
            echo "Следующие файлы не отформатированы gofmt:"
            echo "$out"
            gofmt -d main.go internal/ | head -100
            exit 1
          fi
          echo "Форматирование в порядке."

      - name: go vet (пакеты движка)
        shell: bash
        run: |
          go vet ./internal/model ./internal/netutil ./internal/vuln \
                 ./internal/scanner ./internal/hostcheck ./internal/report

      - name: Юнит-тесты
        shell: bash
        run: go test -v ./internal/vuln ./internal/netutil

  # ================= 2. Сборка Windows + setup.exe =================
  build-windows:
    name: Сборка Windows (setup.exe)
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false

      - name: Обеспечить MinGW (для CGO/Fyne)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          gcc --version

      - name: Скачивание зависимостей (go mod tidy)
        shell: bash
        run: |
          go mod tidy
          go mod download

      - name: go vet (все пакеты, включая UI)
        shell: bash
        run: go vet ./...

      - name: Юнит-тесты
        shell: bash
        run: go test ./internal/...

      - name: Ресурсы Windows (иконка, манифест, версия)
        shell: pwsh
        run: |
          Set-Location build\windows
          windres -i app.rc -o ..\..\app.syso -O coff
          Set-Location ..\..
          Get-Item app.syso

      - name: Сборка CLI-версии
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=1.0.0+build.${{ github.run_number }}" -o dist/SecurityAuditCLI.exe .

      - name: Сборка GUI-версии (Windows GUI subsystem)
        shell: bash
        run: |
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=1.0.0+build.${{ github.run_number }}" -o dist/SecurityAudit.exe .

      - name: Проверочный запуск (smoke test)
        shell: bash
        run: |
          ./dist/SecurityAuditCLI.exe -version
          ./dist/SecurityAuditCLI.exe -cli -host-audit -json dist/host-audit.json
          ./dist/SecurityAuditCLI.exe -cli -targets 127.0.0.1 -profile quick -json dist/scan.json -html dist/scan.html
          ls -la dist/

      - name: Установка Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Сборка установщика setup.exe
        shell: pwsh
        run: |
          $isd = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isd) {
            Write-Output "::error title=ISCC::ISCC.exe не найден после установки Inno Setup"
            exit 1
          }
          Write-Output "Используется: $isd"
          $out = & $isd /Qp /O"dist" /F"Setup-Audit-Zashchity" build\windows\setup.iss 2>&1 | Tee-Object -Variable lines
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines | Select-Object -First 40 | ForEach-Object { Write-Output "::error title=ISCC::$_" }
            exit $code
          }
          Get-ChildItem dist

      - name: Публикация артефактов сборки
        uses: actions/upload-artifact@v4
        with:
          name: OfficeSecurityCheck-windows
          path: |
            dist/Setup-Audit-Zashchity.exe
            dist/SecurityAudit.exe
            dist/SecurityAuditCLI.exe
            dist/scan.html
          if-no-files-found: error

  # ================= 3. GitHub Release по тегу =================
  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          name: OfficeSecurityCheck-windows
          path: dist

      - name: Создание GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Аудит защиты ${{ github.ref_name }}"
          body: |
            Установщик Windows (setup.exe) и портативные версии приложения «Аудит защиты».
            Запустите `Setup-Audit-Zashchity.exe` для установки.
          files: |
            dist/Setup-Audit-Zashchity.exe
            dist/SecurityAudit.exe
            dist/SecurityAuditCLI.exe
